name: Hotfix Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version name, for example 1.13.13-winterloo.1"
        required: true
        type: string
  push:
    tags:
      - "v*-winterloo.*"

permissions:
  contents: write

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
            tag="v${version#v}"
          else
            tag="${GITHUB_REF_NAME}"
            version="${tag#v}"
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"

  build:
    name: Build ${{ matrix.name }}
    needs:
      - version
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-amd64
            runner: windows-latest
            goos: windows
            goarch: amd64
            ext: .exe
            tag_file: release/DEFAULT_BUILD_TAGS_WINDOWS
          - name: darwin-amd64
            runner: macos-latest
            goos: darwin
            goarch: amd64
            ext: ""
            tag_file: release/DEFAULT_BUILD_TAGS_OTHERS
          - name: darwin-arm64
            runner: macos-latest
            goos: darwin
            goarch: arm64
            ext: ""
            tag_file: release/DEFAULT_BUILD_TAGS_OTHERS
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ~1.25.10

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          VERSION: ${{ needs.version.outputs.version }}
          ASSET_NAME: sing-box-${{ needs.version.outputs.version }}-${{ matrix.name }}${{ matrix.ext }}
          TAG_FILE: ${{ matrix.tag_file }}
        run: |
          mkdir -p dist
          tags="$(cat "${TAG_FILE}")"
          ldflags="$(cat release/LDFLAGS)"
          go build -v -trimpath \
            -tags "${tags}" \
            -ldflags "-X 'github.com/sagernet/sing-box/constant.Version=${VERSION}' ${ldflags} -s -w -buildid=" \
            -o "dist/${ASSET_NAME}" \
            ./cmd/sing-box
          "dist/${ASSET_NAME}" version > "dist/${ASSET_NAME}.version.txt" || true

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-${{ needs.version.outputs.version }}-${{ matrix.name }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs:
      - version
      - build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate checksums
        shell: bash
        run: |
          cd dist
          sha256sum sing-box-* > SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          gh release create "${TAG}" dist/* \
            --repo "${GITHUB_REPOSITORY}" \
            --title "sing-box ${VERSION}" \
            --notes "Fork hotfix release for sing-box ${VERSION}. Built from ${GITHUB_SHA}." \
            --prerelease \
            --verify-tag
